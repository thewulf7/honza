[package]
name = "tauri-plugin-mistralrs"
version = "1.0.0"
authors = ["Jan <service@jan.ai>"]
description = "Tauri plugin for managing mistral.rs server processes and model loading"
license = "MIT"
repository = "https://github.com/janhq/jan"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-mistralrs"

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sysinfo = "0.34.2"
tauri = { version = "2.5.0", default-features = false, features = [] }
thiserror = "2.0.12"
tokio = { version = "1", features = ["full"] }
jan-utils = { path = "../../utils" }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Unix-specific dependencies (graceful SIGTERM shutdown)
[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", features = ["signal", "process"] }

[build-dependencies]
tauri-plugin = { version = "2.3.1", features = ["build"] }
