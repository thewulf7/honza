[package]
name = "tauri-plugin-mistralrs"
version = "1.0.0"
authors = ["Jan <service@jan.ai>"]
description = "Tauri plugin for in-process mistral.rs inference (no subprocess binary required)"
license = "MIT"
repository = "https://github.com/janhq/jan"
edition = "2021"
rust-version = "1.88"
links = "tauri-plugin-mistralrs"

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.5.0", default-features = false, features = [] }
thiserror = "2.0.12"
tokio = { version = "1", features = ["full"] }
jan-utils = { path = "../../utils" }
# In-process inference via mistral.rs
mistralrs-server-core = { version = "0.8", default-features = false }
mistralrs-core = { version = "0.8", default-features = false }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["tokio"] }

# CUDA acceleration on Linux / Windows (NVIDIA GPU)
[target.'cfg(not(target_os = "macos"))'.dependencies]
mistralrs-server-core = { version = "0.8", features = ["cuda", "flash-attn-v3", "cudnn"] }
mistralrs-core = { version = "0.8", features = ["cuda", "flash-attn-v3", "cudnn"] }

# Apple Metal acceleration on macOS
[target.'cfg(target_os = "macos")'.dependencies]
mistralrs-server-core = { version = "0.8", features = ["metal"] }
mistralrs-core = { version = "0.8", features = ["metal"] }

[build-dependencies]
tauri-plugin = { version = "2.3.1", features = ["build"] }
