[default]
description = "Default permissions for the mistral.rs plugin"
permissions = [
    "allow-cleanup-mistralrs-processes",
    "allow-load-mistralrs-model",
    "allow-unload-mistralrs-model",
    "allow-is-mistralrs-process-running",
    "allow-get-mistralrs-random-port",
    "allow-find-mistralrs-session-by-model",
    "allow-get-mistralrs-loaded-models",
    "allow-get-mistralrs-all-sessions",
    "allow-set-mistralrs-custom-binary-path",
    "allow-get-mistralrs-resolved-binary-path",
]
