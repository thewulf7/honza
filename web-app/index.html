<!doctype html>
<html lang="en" class="bg-app">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/buro-logo.png"
    />
    
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/buro-logo.png"
    />
    <link rel="apple-touch-icon" href="/images/buro-logo.png" />
    <link
      rel="preload"
      as="image"
      href="/images/jan-logo.png"
      fetchpriority="high"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover"
    />
    <title>Buro</title>
    <style>
        html,
        body {
          width: 100%;
          height: 100%;
          margin: 0;
          overflow: hidden;
        }

        body {
          position: relative;
          background: #f3f4fa;
        }

        body::before,
        body::after {
          content: "";
          position: absolute;
          inset: -20%;
          pointer-events: none;
        }

        body::before {
          background:
            radial-gradient(circle at 15% 85%,
              rgba(120,150,255,.45) 0%,
              transparent 35%),

            radial-gradient(circle at 50% 100%,
              rgba(255,170,220,.25) 0%,
              transparent 35%),

            radial-gradient(circle at 90% 70%,
              rgba(255,210,180,.30) 0%,
              transparent 35%),

            radial-gradient(circle at 50% 50%,
              rgba(190,180,255,.15) 0%,
              transparent 50%);

          filter: blur(60px);

          animation:
            drift 5s ease-in-out infinite alternate,
            breathe 10s ease-in-out infinite;
        }

        body::after {
          width: 140%;
          height: 45%;
          left: -20%;
          bottom: -15%;
          inset: auto;

          background: rgba(255,255,255,.25);

          border-radius: 50%;
          filter: blur(50px);

          animation: wave 10s ease-in-out infinite alternate;
        }

        @keyframes drift {
          0% {
            transform:
              translate3d(-2%, 1%, 0)
              scale(1);
          }

          100% {
            transform:
              translate3d(2%, -2%, 0)
              scale(2);
          }
        }

        @keyframes breathe {
          0%,100% {
            opacity: .55;
          }

          50% {
            opacity: 1;
          }
        }

        @keyframes wave {
          0% {
            transform:
              translateY(0)
              rotate(-1deg);
          }

          100% {
            transform:
              translateY(-200px)
              rotate(1deg);
          }
        }

          /* Inlined so it applies on first paint (external CSS is injected late). */
        #initial-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1.5rem;
          z-index: 9999;
          opacity: 1;
          transition: opacity 0.3s ease-in-out;
        }
        #initial-loader img {
          width: 5rem;
          height: 5rem;
        }

        #initial-loader-caption {
          margin: 0;
          text-align: center;
          line-height: 1;
        font-family:
          "SF Pro Display",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
          font-size: 0.875rem;
          font-weight: 400;
          color: hsl(0, 0%, 45%);
          opacity: 0;
          /* Delayed so fast starts never flash the caption. */
          animation: caption-fade-in 0.3s ease-in-out 1s forwards;
        }
        .dark #initial-loader-caption {
          color: hsl(0, 0%, 65%);
        }
        @keyframes caption-fade-in {
          to {
            opacity: 1;
          }
        }
        .loaded #initial-loader {
          opacity: 0;
          pointer-events: none;
        }
    </style>
    <script>
      // Apply dark class synchronously before first paint to avoid a
      // light-mode flash when the user's effective theme is dark. Truth is
      // re-resolved by ThemeProvider once React mounts (and, on Linux, after
      // the XDG portal read completes).
      (function () {
        try {
          var raw = localStorage.getItem('theme')
          var active = 'auto'
          if (raw) {
            var parsed = JSON.parse(raw)
            var s = parsed && parsed.state
            if (s && typeof s.activeTheme === 'string') active = s.activeTheme
          }
          var dark =
            active === 'dark' ||
            (active === 'auto' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="initial-loader">
      <img src="/images/buro-logo.png" alt="Buro Logo" />
      <p id="initial-loader-caption">Booting up Jan…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
